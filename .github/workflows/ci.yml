name: ECF CI/CD Quality Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Audit (Node ${{ matrix.node-version }} - ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['22.x', '24.x']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.17.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Approve Build Scripts
        run: pnpm approve-builds --all

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check (TypeScript Declarations)
        run: pnpm exec tsc --noEmit

      - name: Run Full Workspace Tests
        run: pnpm test

      - name: Run Ecosystem Benchmarks
        run: node --test packages/testing/tests/benchmarks/EcosystemBenchmark.test.js

      - name: Show git status & changes (debug)
        run: |
          echo "Git status (porcelain):"
          git status --porcelain || true
          echo "--- Unstaged diff (names only) ---"
          git diff --name-only || true
          echo "--- Untracked files ---"
          git ls-files --others --exclude-standard || true

      - name: Package Bundle Dry-Run Audit
        run: pnpm publish --dry-run --no-git-checks
